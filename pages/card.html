<!DOCTYPE html> <!-- Сообщает браузеру, что страница написана на современном стандарте HTML5 -->
<html lang="ru">
<head>
    <!-- Задает кодировку UTF-8, чтобы русский текст не превращался в иероглифы -->
    <meta charset="UTF-8">

    <!-- Делает сайт адаптивным, чтобы он нормально масштабировался на экранах смартфонов -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Название страницы, которое будет отображаться на вкладке в браузере -->
    <title>Гайд по CSS | </title>

    <!--Указание темы -->
    <meta name="theme-color" content="#6366f1">

    <!-- файл стилей -->
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/card.css">

    <!-- Главный JavaScript файл-->
    <script type="module" src="../../main.js"></script>

    <!-- Подключение шрифта -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,100..900;1,100..900&family=Jost:ital,wght@0,100..900;1,100..900&family=PT+Sans:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <!-- тёмная тема -->
    <meta name="color-scheme" content="dark">

</head>
<body>
    <section class="new-projects-section">
      <h2 class="new-projects-title">Уроки</h2>
      <div class="config-system">
        <h3>Управление прогрессом</h3>
        <p class="config-desc">Сайт работает без серверов. Чтобы не потерять прогресс, сохраняйте файл конфигурации.</p>

        <div class="config-actions">
          <!-- Кнопка выгрузки -->
          <button onclick="exportConfig()" class="btn-export">Выгрузить конфиг (.json)</button>

          <!-- Кнопка загрузки (скрытый инпут под красивой кнопкой) -->
          <label class="btn-import-label">
            Загрузить конфиг
            <input type="file" id="configFileInput" accept=".json" onchange="importConfig(event)" style="display: none;" />
          </label>
        </div>
      </div>



    <load src="../pages/lesson.html"/>
    <div data-include="../../blocks/header.html"></div>
    <div data-include="../../blocks/feedback.html"></div>
    <div data-include="../../blocks/footer.html"></div>




    <div class="cursor-dot"></div>

</body>
</html>
