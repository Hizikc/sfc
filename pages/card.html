<!DOCTYPE html> <!-- Сообщает браузеру, что страница написана на современном стандарте HTML5 -->
<html lang="ru">
<head>
    <!-- Задает кодировку UTF-8, чтобы русский текст не превращался в иероглифы -->
    <meta charset="UTF-8">

    <!-- Делает сайт адаптивным, чтобы он нормально масштабировался на экранах смартфонов -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Название страницы, которое будет отображаться на вкладке в браузере -->
    <title>Гайд по CSS | </title>

    <!--Указание темы -->
    <meta name="theme-color" content="#6366f1">

    <!-- файл стилей -->
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/card.css">

    <!-- Главный JavaScript файл-->
    <script type="module" src="../../main.js"></script>

    <!-- Подключение шрифта -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,100..900;1,100..900&family=Jost:ital,wght@0,100..900;1,100..900&family=PT+Sans:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <!-- тёмная тема -->
    <meta name="color-scheme" content="dark">

</head>
<body>
    <section class="new-projects-section">

      <!-- Этот контейнер выровняет карточки ровно по центру -->
      <div class="new-projects-grid">

        <!-- Карточка 1 -->
        <div class="new-card">
          <div class="new-badge">ACTIVE V1.0.0</div>
          <h3 class="new-card-title">hiz.log</h3>
          <p class="new-card-text">Сайт для отслеживания версий проектов hiz.</p>
          <a href="#" class="new-card-btn">Подробнее &rarr;</a>
        </div>

        <!-- Карточка 2 -->
        <div class="new-card">
          <div class="new-badge">ACTIVE V1.0.1</div>
          <h3 class="new-card-title">hiz.html</h3>
          <p class="new-card-text">Личный сайт hiz.</p>
          <a href="#" class="new-card-btn">Подробнее &rarr;</a>
        </div>

      </div>
    </section>



    <div data-include="../../blocks/header.html"></div>
    <div data-include="../../blocks/feedback.html"></div>
    <div data-include="../../blocks/footer.html"></div>




    <div class="cursor-dot"></div>

</body>
</html>
