<!DOCTYPE html> <!-- Сообщает браузеру, что страница написана на современном стандарте HTML5 -->
<html lang="ru">
<head>
    <!-- Задает кодировку UTF-8, чтобы русский текст не превращался в иероглифы -->
    <meta charset="UTF-8">

    <!-- Делает сайт адаптивным, чтобы он нормально масштабировался на экранах смартфонов -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Название страницы, которое будет отображаться на вкладке в браузере -->
    <title>Гайд по CSS | Главная</title>

    <!--Указание темы -->
    <meta name="theme-color" content="#6366f1">

    <!-- файл стилей -->
    <link rel="stylesheet" href="./css/style.css">

    <!-- Главный JavaScript файл-->
    <script type="module" src="./main.js"></script>

    <!-- Подключение шрифта -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,100..900;1,100..900&family=Jost:ital,wght@0,100..900;1,100..900&family=PT+Sans:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <!-- тёмная тема -->
    <meta name="color-scheme" content="dark">

</head>
<body>
    <!-- Подключение верхней панели header -->
    <load src="./blocks/header.html" />

    <div data-include="./blocks/hero.html"></div>
    <div data-include="./blocks/feedback.html"></div>
    <!--data-include="./blocks/footer.html"-->
    <div class="cursor-dot"></div>

</body>
</html>
